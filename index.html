<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المكتب / دريسدن</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #162032;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #26354d;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px;
      max-width: 1200px;
      margin-inline: auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }
    .brand { font-size: 1.2rem; font-weight: bold; color: var(--text); }
    .btn {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); padding: 8px 16px;
      border-radius: 10px; cursor: pointer; font-size: 0.9rem;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      margin-block: auto;
      padding-block: 30px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .location-tag { color: var(--accent); font-size: 1rem; font-weight: 600; margin-bottom: 10px; }
    .clock { font-size: 4.8rem; font-weight: 800; letter-spacing: 2px; line-height: 1.1; direction: ltr; text-align: right; }
    .seconds { font-size: 2rem; color: var(--muted); font-weight: 400; }
    .date { font-size: 1.3rem; color: var(--muted); margin-top: 15px; }
    .weather-header { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.95rem; }
    .weather-main { display: flex; align-items: center; gap: 20px; margin: 25px 0; }
    .weather-icon { font-size: 4rem; }
    .temp-now { font-size: 4.5rem; font-weight: 800; line-height: 1; direction: ltr; }
    .weather-status { font-size: 1.2rem; color: var(--accent); margin-top: 5px; }
    .metrics {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      padding-block: 15px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      text-align: center; font-size: 0.95rem;
    }
    .metrics span { color: var(--muted); display: block; font-size: 0.85rem; margin-bottom: 4px; }
    .forecast {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      margin-top: 20px; text-align: center;
    }
    .forecast-day { background: rgba(11, 17, 32, 0.5); padding: 12px; border-radius: 12px; }
    .forecast-day small { color: var(--muted); display: block; margin-bottom: 5px; }
    .forecast-day strong { font-size: 1.2rem; direction: ltr; display: inline-block; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding-top: 15px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">◈ لوحة المكتب / دريسدن</div>
    <button class="btn" onclick="toggleFullScreen()">⛶ ملء الشاشة</button>
  </header>

  <main>
    <div class="card">
      <div class="location-tag">📍 التوقيت المحلي · دريسدن، ألمانيا</div>
      <div class="clock"><span id="hm">--:--</span><span class="seconds" id="sec">:--</span></div>
      <div class="date" id="date">جارٍ تحميل التاريخ...</div>
    </div>

    <div class="card">
      <div class="weather-header">
        <span>الطقس الخارجي المباشر</span>
        <span>Dresden Live</span>
      </div>
      
      <div class="weather-main">
        <div class="weather-icon" id="w-icon">⛅</div>
        <div>
          <div class="temp-now" id="temp-now">--°</div>
          <div class="weather-status" id="w-desc">جارٍ جلب البيانات...</div>
        </div>
      </div>

      <div class="metrics">
        <div><span>الرطوبة</span><strong id="hum">--%</strong></div>
        <div><span>سرعة الرياح</span><strong id="wind">-- كم/س</strong></div>
        <div><span>المحسوسة</span><strong id="feels">--°</strong></div>
      </div>

      <div class="forecast">
        <div class="forecast-day"><small>اليوم (العظمى)</small><strong id="day0">--°</strong></div>
        <div class="forecast-day"><small>غداً</small><strong id="day1">--°</strong></div>
        <div class="forecast-day"><small>بعد غد</small><strong id="day2">--°</strong></div>
      </div>
    </div>
  </main>

  <footer>
    تحديث تلقائي للطقس كل 30 دقيقة · دريسدن، ألمانيا
  </footer>

  <script>
    function pad(n) { return n < 10 ? '0' + n : n; }

    function updateClock() {
      const now = new Date();
      document.getElementById('hm').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
      document.getElementById('sec').textContent = ':' + pad(now.getSeconds());
      document.getElementById('date').textContent = now.toLocaleDateString('ar-EG', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getIcon(code) {
      const c = Number(code);
      if (c === 113) return '☀️';
      if (c === 116) return '⛅';
      if (c === 119 || c === 122) return '☁️';
      if (c === 143 || c === 248 || c === 260) return '🌫️';
      if (c >= 176 && c <= 359) return '🌧️';
      if (c >= 362) return '❄️';
      return '🌤️';
    }

    async function fetchWeather() {
      try {
        const res = await fetch('https://wttr.in');
        const data = await res.json();
        const cur = data.current_condition.at(0);
        const days = data.weather;

        document.getElementById('w-icon').textContent = getIcon(cur.weatherCode);
        document.getElementById('temp-now').textContent = cur.temp_C + '°';
        document.getElementById('feels').textContent = cur.FeelsLikeC + '°';
        document.getElementById('wind').textContent = cur.windspeedKmph + ' كم/س';
        document.getElementById('hum').textContent = cur.humidity + '%';
        document.getElementById('w-desc').textContent = 'مباشر · دريسدن';

        document.getElementById('day0').textContent = days.at(0).maxtempC + '°';
        document.getElementById('day1').textContent = days.at(1).maxtempC + '°';
        document.getElementById('day2').textContent = days.at(2).maxtempC + '°';
      } catch (e) {
        document.getElementById('w-desc').textContent = 'جاري إعادة المحاولة...';
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 1800000);

    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  </script>
</body>
</html>
